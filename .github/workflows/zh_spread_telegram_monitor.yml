name: KC Coffee Market & Inventory Monitor (Telegram Bot)

on:
  schedule:
    # Run at :15 and :45 past each hour (the python script internally guards active ICE market hours)
    - cron: '15,45 * * * *'
  repository_dispatch:
    types: [kc-monitor, zh-monitor]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force send update even if market is currently closed'
        required: false
        type: boolean
        default: false
      settle_only:
        description: 'Use official daily settles instead of live intraday quote'
        required: false
        type: boolean
        default: false

concurrency:
  group: kc-market-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run KC Market & Inventory Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          CQG_USERNAME: ${{ secrets.CQG_USERNAME }}
          CQG_PASSWORD: ${{ secrets.CQG_PASSWORD }}
          CQG_BROKER: ${{ secrets.CQG_BROKER }}
          CQG_URL: ${{ secrets.CQG_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.settle_only }}" = "true" ]; then
            ARGS="$ARGS --settle-only"
          fi
          python scripts/telegram_kc_bot.py $ARGS
