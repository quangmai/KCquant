[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcquant"
version = "0.1.0"
description = "Coffee futures (ICE KC, later RC) research: data, roll engine, curve features"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "scipy>=1.10", "pyarrow>=12", "selenium>=4.20"]

[project.optional-dependencies]
databento = ["databento>=0.40"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
