services:
  - type: worker
    name: kcquant-telegram-bot
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CQG_USERNAME
        sync: false
      - key: CQG_PASSWORD
        sync: false
      - key: CQG_BROKER
        value: cqg
      - key: DATABENTO_API_KEY
        sync: false
